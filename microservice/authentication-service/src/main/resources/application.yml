server:
  port: ${PUERTO_SERVIDOR:8081}
  forward-headers-strategy: framework
spring:
  application:
    name: servicio-autenticacion
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: false
  datasource:
    url: ${URL_BASE_DATOS:jdbc:postgresql://localhost:5432/bd_autenticacion}
    username: ${USUARIO_BASE_DATOS:nullpointer}
    password: ${CLAVE_BASE_DATOS:nullpointer_local_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${MAX_CONEXIONES_BD:10}
      minimum-idle: ${MIN_CONEXIONES_BD:2}
      connection-timeout: 30000
      pool-name: NullPointerPool
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
app:
  jwt:
    secreto: ${SECRETO_JWT:NullPointerPOS-Local-Secret-For-Demo-Only-2026!ChangeBeforeProduction}
    vigencia-minutos: ${VIGENCIA_JWT_MINUTOS:480}
  cors:
    origenes-permitidos: ${ORIGENES_CORS_PERMITIDOS:*}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    org.springframework.security: INFO
    pe.upeu.nullpointerpos: INFO

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
