server:
  port: ${PUERTO_SERVIDOR:8086}
  forward-headers-strategy: framework
spring:
  application:
    name: servicio-inventario
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: false
  datasource:
    url: ${URL_BASE_DATOS:jdbc:postgresql://localhost:5432/bd_inventario}
    username: ${USUARIO_BASE_DATOS:nullpointer}
    password: ${CLAVE_BASE_DATOS:nullpointer_local_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${MAX_CONEXIONES_BD:10}
      minimum-idle: ${MIN_CONEXIONES_BD:2}
      connection-timeout: 30000
      pool-name: NullPointerInventarioPool
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  rabbitmq:
    host: ${ANFITRION_RABBITMQ:localhost}
    port: ${PUERTO_RABBITMQ:5672}
    username: ${USUARIO_RABBITMQ:guest}
    password: ${CLAVE_RABBITMQ:guest}
  jackson:
    default-property-inclusion: non_null
app:
  jwt:
    secreto: ${SECRETO_JWT:NullPointerPOS-Local-Secret-For-Demo-Only-2026!ChangeBeforeProduction}
  cors:
    origenes-permitidos: ${ORIGENES_CORS_PERMITIDOS:*}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    org.springframework.security: INFO
    pe.upeu.nullpointerpos: INFO
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
